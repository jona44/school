{% extends "partials/base.html" %}
{% load crispy_forms_tags %}

<title>School Admin Profile</title>

{% block content %}
  <h2>School Admin Profile</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit">Update Profile</button>
  </form>
{% endblock %}
