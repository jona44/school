{% extends 'partials/base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container mt-4">
    <h2>{% if form.instance.pk %}Edit{% else %}Create{% endif %} Class Profile</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            {{ form|crispy }}
        </div>
        <button type="submit" class="btn btn-success">Save</button>
        <a href="{% url 'class_profile_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
