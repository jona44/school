{% extends 'partials/base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container mt-4">
    <h2>Delete Class Profile</h2>
    <p>Are you sure you want to delete <strong>{{ class_profile.name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'class_profile_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
