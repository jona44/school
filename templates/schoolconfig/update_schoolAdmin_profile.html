{% extends "partials/base.html" %}
{% load crispy_forms_tags %}

<title>School Admin Profile</title>

{% block content %}


  <div class="row offset-md-2">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-header">
          <h4 class="card-title">School Admin Profile</h4>
        </div>
        <div class="card-body">
          <form method="post" >
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary">Update Profile</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
 
{% endblock %}
