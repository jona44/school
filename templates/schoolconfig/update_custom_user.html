{% extends 'partials/base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container offset-md-1 mt-5 border shadow p-5">
    <h2>Update User</h2>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">Update</button>
    </form>
</div>
{% endblock %}
