<!doctype html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{%static 'css\academia.css' %}">
    <link rel="stylesheet" href="{%static 'css\base.css' %}">
    <link rel="stylesheet" href="{%static 'css\students.css' %}">
    <link rel="stylesheet" href="{%static 'css\bootstrap.min.css' %}">
  </head>
  <body >
   
    <div>
      <div class="position-fixed">
        {% include 'partials/sidebar.html'%}
      </div>
      
      <div class="section">
        <div class="d-flex justify-content-center mb-5 "style="height: 100px;">
          {% include 'partials/nav.html'%}
        </div> 
        
        <div>
          <div class="modal fade" id="searchUserModal" tabindex="-1" aria-labelledby="searchUserModalLabel" aria-hidden="true">
              <div class="modal-dialog modal-lg">
                  <div class="modal-content">
                      <div class="modal-header">
                          <h5 class="modal-title" id="searchUserModalLabel">Search User</h5>
                          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                      </div>
                      <div class="modal-body">
                          <form id="searchUserForm">
                              <div class="input-group mb-3">
                                  <input type="text" class="form-control" name="query" placeholder="Search for user...">
                                  <button class="btn btn-primary" type="submit">Search</button>
                              </div>
                          </form>
                          <table class="table table-striped">
                              <thead>
                                  <tr>
                                      <th>Name</th>
                                      <th>Email</th>
                                      <th>Action</th>
                                  </tr>
                              </thead>
                              <tbody id="searchResults">
                                  <!-- Search results will be appended here -->
                              </tbody>
                          </table>
                      </div>
                  </div>
              </div>
          </div>          
          <div class="section position-fixed overflow-y-auto" style="height:80vh;">
            <div class="">{% if messages %}  {% for message in messages %} 
              <div class="alert alert-{{ message.tags }} col-8 offset-md-1">
               {{ message }}
              </div>
              {% endfor %}
              {% endif %}
          </div>
              {% block content %}
              {% endblock %}
            </div>
        </div>
      </div>
   </div>
  <script>
        document.addEventListener('DOMContentLoaded', function () {
        const searchUserForm = document.getElementById('searchUserForm');
        const searchResults = document.getElementById('searchResults');
    
        searchUserForm.addEventListener('submit', function (event) {
            event.preventDefault();
            const query = searchUserForm.querySelector('input[name="query"]').value;
    
            fetch(`/search_custom_user/?query=${query}`)
                .then(response => response.json())
                .then(data => {
                    searchResults.innerHTML = '';
                    data.results.forEach(user => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${user.name}</td>
                            <td>${user.email}</td>
                            <td>
                                <button type="button" class="btn btn-primary select-user" data-user-id="${user.id}" data-user-name="${user.name}">Select</button>
                            </td>
                        `;
                        searchResults.appendChild(row);
                    });
    
                    document.querySelectorAll('.select-user').forEach(button => {
                        button.addEventListener('click', function () {
                            const userId = this.getAttribute('data-user-id');
                            window.location.href = `/update_custom_user/${userId}/`;

                        });
                    });
                });
        });
    });
  </script>
 <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
   <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
   <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
  </body>
</html>
